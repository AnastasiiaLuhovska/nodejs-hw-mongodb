tags:
  - Auth
summary: Register new user
operationId: registerUser
description: 'Register new user account'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            example: 'John Doe'
            description: "User's name"
          email:
            type: string
            format: email
            example: 'john.doe@example.com'
            description: "User's email"
          password:
            type: string
            minLength: 6
            example: 'password123'
            description: "User's password (minimum 6 characters)"
responses:
  '201':
    description: 'Successfully registered user'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered user!
            data:
              $ref: '../../../components/schemas/user.yaml'
  '400':
    description: 'Bad request'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: BadRequestError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Email already exists'
  '500':
    $ref: '../../../components/responses/500.yaml'