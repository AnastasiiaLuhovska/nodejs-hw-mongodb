tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login user with email and password'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: 'john.doe@example.com'
            description: "User's email"
          password:
            type: string
            example: 'password123'
            description: "User's password"
responses:
  '200':
    description: 'Successfully logged in'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in user!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  description: 'JWT access token'
    headers:
      Set-Cookie:
        description: 'Refresh token cookie'
        schema:
          type: string
          example: 'refreshToken=abc123; HttpOnly; Secure'
  '401':
    description: 'Unauthorized'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Invalid credentials'
  '500':
    $ref: '../../../components/responses/500.yaml'