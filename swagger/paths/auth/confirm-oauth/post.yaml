tags:
  - Auth
summary: Confirm Google OAuth
operationId: confirmGoogleOAuth
description: 'Confirm Google OAuth and login user'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            example: '4/0AX4XfWh5...'
            description: 'Authorization code from Google OAuth callback'
responses:
  '200':
    description: 'Successfully logged in with Google'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in user via Google OAuth!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  description: 'JWT access token'
    headers:
      Set-Cookie:
        description: 'Refresh token cookie'
        schema:
          type: string
          example: 'refreshToken=abc123; HttpOnly; Secure'
  '401':
    description: 'Unauthorized'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Unauthorized'
  '500':
    $ref: '../../../components/responses/500.yaml'