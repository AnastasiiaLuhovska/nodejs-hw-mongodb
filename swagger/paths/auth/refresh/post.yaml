tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: 'Refresh access token using refresh token from cookies'
responses:
  '200':
    description: 'Successfully refreshed token'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed session!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  description: 'New JWT access token'
    headers:
      Set-Cookie:
        description: 'New refresh token cookie'
        schema:
          type: string
          example: 'refreshToken=abc123; HttpOnly; Secure'
  '401':
    description: 'Unauthorized'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Session not found'
  '500':
    $ref: '../../../components/responses/500.yaml'