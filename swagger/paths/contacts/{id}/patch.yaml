tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update existing contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: Contact ID
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
            description: "Contact's name"
          phoneNumber:
            type: string
            example: '+1234567890'
            description: "Contact's phone number"
          email:
            type: string
            example: 'john.doe@example.com'
            description: "Contact's email"
          isFavourite:
            type: boolean
            example: false
            description: 'Whether the contact is favorite'
          contactType:
            type: string
            enum: ['personal', 'home', 'work']
            example: 'personal'
            description: "Contact's type"
          photo:
            type: string
            format: binary
            description: "Contact's photo file"
responses:
  '200':
    description: 'Successfully updated contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: 'Bad request - Invalid contact ID or validation error'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: BadRequestError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Invalid contact ID format
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'